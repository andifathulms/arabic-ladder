:\"Mad, sukun, syaddah dan tanwin, lalu bunyi-bunyi yang sering tertukar oleh penutur bahasa Indonesia.\",\"en\":\"Long vowels, sukun, shaddah and tanwin, then the sounds Indonesian speakers tend to merge.\"},\"topics\":[\"mad (vokal panjang)\",\"sukun\",\"syaddah\",\"tanwin\",\"al- syamsiyah dan qamariyah\",\"hamzah washal\",\"ع/ء ح/ه خ/ك\",\"ق/ك ث/س/ص ذ/ز/ظ ض/د\",\"imla' (dikte)\",\"membaca tanpa transliterasi\"],\"threads\":[\"script\",\"sounds\",\"definiteness\"],\"inventory\":[\"mad\",\"sukun\",\"syaddah\",\"tanwin\",\"al-sun-moon\",\"hamzat-wasl\",\"sounds-throat\",\"sounds-merged\",\"imla\",\"reading-passage\"]},\"pool\":{\"rung\":\"huruf-1\",\"draw\":14,\"pass\":11,\"items\":[{\"id\":\"h1-t-01\",\"why\":{\"id\":\"Arab dibaca dari kanan ke kiri, jadi kata pertama ada di kanan.\",\"en\":\"Arabic is read right to left, so the first word is on the right.\"},\"from\":\"huruf1-01-kamu-sudah-tahu\",\"match\":\"exact\",\"type\":\"choice\",\"prompt\":\"Kata pertama di satu baris tulisan Arab ada di sebelah mana?\",\"options\":[\"kanan\",\"kiri\"],\"answer\":\"kanan\"},{\"id\":\"h1-t-02\",\"why\":{\"id\":\"Kasrah ada di bawah huruf dan dibaca *i*.\",\"en\":\"Kasrah sits below the letter and is read *i*.\"},\"from\":\"huruf1-01-kamu-sudah-tahu\",\"match\":\"exact\",\"type\":\"choice\",\"prompt\":\"Vokal pendek yang ditulis di bawah huruf namanya apa?\",\"options\":[\"kasrah\",\"fathah\",\"dhammah\"],\"answer\":\"kasrah\"},{\"id\":\"h1-t-03\",\"why\":{\"id\":\"Dhammah dibaca *u*: *bu*.\",\"en\":\"Dhammah is read *u*: *bu*.\"},\"from\":\"huruf1-02-ba-ta-tsa\",\"match\":\"exact\",\"type\":\"read\",\"ar\":\"بُ\",\"options\":[\"ba\",\"bi\",\"bu\"],\"answer\":\"bu\"},{\"id\":\"h1-t-04\",\"why\":{\"id\":\"Dua titik di atas adalah ت, dan kasrah dibaca *i*.\",\"en\":\"Two dots above is ت, and kasrah is read *i*.\"},\"from\":\"huruf1-02-ba-ta-tsa\",\"match\":\"exact\",\"type\":\"choice\",\"prompt\":\"Mana yang dibaca *ti*?\",\"options\":[\"تِ\",\"ثِ\",\"تَ\"],\"answer\":\"تِ\"},{\"id\":\"h1-t-05\",\"why\":{\"id\":\"Ujung lidah di antara gigi: *tsa*, huruf ث.\",\"en\":\"Tongue tip between the teeth: *tha*, the letter ث.\"},\"from\":\"huruf1-02-ba-ta-tsa\",\"match\":\"exact\",\"type\":\"listen\",\"audio\":\"ثَ\",\"variety\":\"fusha\",\"options\":[\"ثَ\",\"تَ\",\"بَ\"],\"answer\":\"ثَ\"},{\"id\":\"h1-t-06\",\"why\":{\"id\":\"Dua titik di bawah gigi pertama: ي, dibaca *ya*.\",\"en\":\"Two dots under the first tooth: ي, read *ya*.\"},\"from\":\"huruf1-03-nun-ya\",\"match\":\"exact\",\"type\":\"read\",\"ar\":\"يَثِبُ\",\"options\":[\"yatsibu\",\"natsibu\",\"batsibu\"],\"answer\":\"yatsibu\"},{\"id\":\"h1-t-07\",\"why\":{\"id\":\"Titik di atas (na), di bawah (ba), dua di atas (ta).\",\"en\":\"Dot above (na), below (ba), two above (ta).\"},\"from\":\"huruf1-03-nun-ya\",\"match\":\"exact\",\"type\":\"spell\",\"prompt\":\"Susun suku katanya: *na-ba-ta*.\",\"letters\":[\"نَ\",\"بَ\",\"تَ\"],\"distractors\":[\"يَ\",\"ثَ\"],\"answer\":\"نَبَتَ\"},{\"id\":\"h1-t-08\",\"why\":{\"id\":\"ح tanpa titik. ج titiknya di bawah, خ di atas.\",\"en\":\"ح has no dot. ج has its dot below, خ above.\"},\"from\":\"huruf1-04-jim-ha-kha\",\"match\":\"exact\",\"type\":\"choice\",\"prompt\":\"Huruf mana yang tidak bertitik?\",\"options\":[\"ح\",\"ج\",\"خ\"],\"answer\":\"ح\"},{\"id\":\"h1-t-09\",\"why\":{\"id\":\"Titik di bawah lalu tanpa titik: ج lalu ح.\",\"en\":\"A dot below, then no dot: ج then ح.\"},\"from\":\"huruf1-04-jim-ha-kha\",\"match\":\"exact\",\"type\":\"read\",\"ar\":\"نَجَحَ\",\"options\":[\"najaḥa\",\"najakha\",\"nakhaja\"],\"answer\":\"najaḥa\"},{\"id\":\"h1-t-10\",\"why\":{\"id\":\"Bunyinya serak, seperti *kh* di *akhir*: خ.\",\"en\":\"It rasped, like *kh* in *akhir*: خ.\"},\"from\":\"huruf1-04-jim-ha-kha\",\"match\":\"exact\",\"type\":\"listen\",\"audio\":\"خُ\",\"variety\":\"fusha\",\"options\":[\"خُ\",\"حُ\",\"جُ\"],\"answer\":\"خُ\"},{\"id\":\"h1-t-11\",\"why\":{\"id\":\"ر termasuk ا د ذ ر ز و, yang tidak pernah menyambung ke huruf sesudahnya.\",\"en\":\"ر is one of ا د ذ ر ز و, which never join to the next letter.\"},\"from\":\"huruf1-05-tidak-menyambung\",\"match\":\"exact\",\"type\":\"choice\",\"prompt\":\"Mana yang termasuk enam huruf yang tidak menyambung ke kiri?\",\"options\":[\"ر\",\"ج\",\"ب\"],\"answer\":\"ر\"},{\"id\":\"h1-t-12\",\"why\":{\"id\":\"د tanpa titik dibaca *d*, dan semua vokalnya fathah kecuali yang terakhir.\",\"en\":\"Dotless د is read *d*, and every vowel is fathah except the last.\"},\"from\":\"huruf1-05-tidak-menyambung\",\"match\":\"exact\",\"type\":\"read\",\"ar\":\"بَدَنُ\",\"options\":[\"badanu\",\"badzanu\",\"bidanu\"],\"answer\":\"badanu\"},{\"id\":\"h1-t-13\",\"why\":{\"id\":\"Dibaca *udzunu*: alif membawa dhammah.\",\"en\":\"It is read *udzunu*: the alif carries dhammah.\"},\"from\":\"huruf1-05-tidak-menyambung\",\"match\":\"exact\",\"type\":\"mark\",\"ar\":\"أُذُنُ\",\"target\":0,\"options\":[\"fatha\",\"kasra\",\"damma\"],\"answer\":\"damma\"},{\"id\":\"h1-t-14\",\"why\":{\"id\":\"Lingkaran pipih tanpa titik adalah ص, *s* yang tebal.\",\"en\":\"The flat loop with no dot is ص, a heavy *s*.\"},\"from\":\"huruf1-06-sin-syin-shad-dhad\",\"match\":\"exact\",\"type\":\"read\",\"ar\":\"بَصَرُ\",\"options\":[\"baṣaru\",\"basaru\",\"basyaru\"],\"answer\":\"baṣaru\"},{\"id\":\"h1-t-15\",\"why\":{\"id\":\"Sebab itu *sababu*, dengan س tanpa titik.\",\"en\":\"Reason is *sababu*, with dotless س.\"},\"from\":\"huruf1-06-sin-syin-shad-dhad\",\"match\":\"exact\",\"type\":\"spell\",\"prompt\":\"Susun suku katanya: *sa-ba-bu*.\",\"letters\":[\"سَ\",\"بَ\",\"بُ\"],\"distractors\":[\"شَ\",\"صَ\"],\"answer\":\"سَبَبُ\"},{\"id\":\"h1-t-16\",\"why\":{\"id\":\"ع tanpa titik, dan huruf terakhir berdhammah.\",\"en\":\"ع without a dot, and the last letter has dhammah.\"},\"from\":\"huruf1-07-tha-zha-ain-ghain\",\"match\":\"exact\",\"type\":\"read\",\"ar\":\"عَرَبُ\",\"options\":[\"ʿarabu\",\"gharabu\",\"ʿaraba\"],\"answer\":\"ʿarabu\"},{\"id\":\"h1-t-17\",\"why\":{\"id\":\"ظ adalah ط dengan satu titik.\",\"en\":\"ظ is ط with one dot.\"},\"from\":\"huruf1-07-tha-zha-ain-ghain\",\"match\":\"exact\",\"type\":\"choice\",\"prompt\":\"Mana yang dibaca *ẓa*?\",\"options\":[\"ظَ\",\"طَ\",\"ضَ\"],\"answer\":\"ظَ\"},{\"id\":\"h1-t-18\",\"why\":{\"id\":\"Dibaca *ʿinabu*: ع berharakat kasrah.\",\"en\":\"It is read *ʿinabu*: ع has kasrah.\"},\"from\":\"huruf1-07-tha-zha-ain-ghain\",\"match\":\"exact\",\"type\":\"mark\",\"ar\":\"عِنَبُ\",\"target\":0,\"options\":[\"fatha\",\"kasra\",\"damma\"],\"answer\":\"kasra\"},{\"id\":\"h1-t-19\",\"why\":{\"id\":\"Dua titik di atas: ق, dibaca *q*.\",\"en\":\"Two dots above: ق, read *q*.\"},\"from\":\"huruf1-08-fa-qaf\",\"match\":\"exact\",\"type\":\"read\",\"ar\":\"وَرَقُ\",\"options\":[\"waraqu\",\"waraku\",\"warafu\"],\"answer\":\"waraqu\"},{\"id\":\"h1-t-20\",\"why\":{\"id\":\"Bunyinya dalam dari pangkal lidah: ق.\",\"en\":\"A deep sound from the back of the tongue: ق.\"},\"from\":\"huruf1-08-fa-qaf\",\"match\":\"exact\",\"type\":\"listen\",\"audio\":\"قَ\",\"variety\":\"fusha\",\"options\":[\"قَ\",\"فَ\"],\"answer\":\"قَ\"},{\"id\":\"h1-t-21\",\"why\":{\"id\":\"Susu itu *labanu*: لَ, بَ, نُ.\",\"en\":\"Milk is *labanu*: لَ, بَ, نُ.\"},\"from\":\"huruf1-09-kaf-lam\",\"match\":\"exact\",\"type\":\"spell\",\"prompt\":\"Susun suku katanya: *la-ba-nu*.\",\"letters\":[\"لَ\",\"بَ\",\"نُ\"],\"distractors\":[\"كَ\",\"يُ\"],\"answer\":\"لَبَنُ\"},{\"id\":\"h1-t-22\",\"why\":{\"id\":\"Madu dimulai dengan ع, bukan alif.\",\"en\":\"Honey starts with ع, not alif.\"},\"from\":\"huruf1-09-kaf-lam\",\"match\":\"exact\",\"type\":\"read\",\"ar\":\"عَسَلُ\",\"options\":[\"ʿasalu\",\"asalu\",\"ʿasala\"],\"answer\":\"ʿasalu\"},{\"id\":\"h1-t-23\",\"why\":{\"id\":\"ذ dibaca *dz*, dan ه adalah *h* ringan.\",\"en\":\"ذ is read *dz*, and ه is a light *h*.\"},\"from\":\"huruf1-10-mim-ha\",\"match\":\"exact\",\"type\":\"read\",\"ar\":\"ذَهَبُ\",\"options\":[\"dzahabu\",\"zahabu\",\"dzaḥabu\"],\"answer\":\"dzahabu\"},{\"id\":\"h1-t-24\",\"why\":{\"id\":\"Pena itu *qalamu*: ق, bukan ك, dan م berdhammah.\",\"en\":\"Pen is *qalamu*: ق, not ك, and م with dhammah.\"},\"from\":\"huruf1-10-mim-ha\",\"match\":\"exact\",\"type\":\"spell\",\"prompt\":\"Susun suku katanya: *qa-la-mu*.\",\"letters\":[\"قَ\",\"لَ\",\"مُ\"],\"distractors\":[\"كَ\",\"مِ\"],\"answer\":\"قَلَمُ\"},{\"id\":\"h1-t-25\",\"why\":{\"id\":\"Bentuk ه dengan dua titik di akhir kata adalah ta marbuthah.\",\"en\":\"The ه shape with two dots at the end of a word is ta marbuta.\"},\"from\":\"huruf1-11-hamzah-ta-marbuthah\",\"match\":\"exact\",\"type\":\"choice\",\"prompt\":\"Huruf terakhir di kata ثَمَرَةُ namanya apa?\",\"options\":[\"ta marbuthah\",\"ha\",\"ta\"],\"answer\":\"ta marbuthah\"},{\"id\":\"h1-t-26\",\"why\":{\"id\":\"ئ adalah hamzah di atas gigi ya: hentakan kecil, *ʾ*.\",\"en\":\"ئ is hamza on a ya tooth: a small catch, *ʾ*.\"},\"from\":\"huruf1-11-hamzah-ta-marbuthah\",\"match\":\"exact\",\"type\":\"read\",\"ar\":\"رِئَةُ\",\"options\":[\"riʾatu\",\"riyatu\",\"riʿatu\"],\"answer\":\"riʾatu\"},{\"id\":\"h1-t-27\",\"why\":{\"id\":\"ش ج ر menyambung, lalu ة berdiri sendiri setelah ر.\",\"en\":\"ش ج ر join, then ة stands alone after ر.\"},\"from\":\"huruf1-12-empat-bentuk\",\"match\":\"exact\",\"type\":\"spell\",\"prompt\":\"Susun suku katanya: *sya-ja-ra-tu*.\",\"letters\":[\"شَ\",\"جَ\",\"رَ\",\"ةُ\"],\"distractors\":[\"سَ\",\"هُ\"],\"answer\":\"شَجَرَةُ\"},{\"id\":\"h1-t-28\",\"why\":{\"id\":\"ر tidak menyambung ke kiri, jadi ج mulai dengan bentuk awal.\",\"en\":\"ر doesn't join to the left, so ج starts in its initial form.\"},\"from\":\"huruf1-12-empat-bentuk\",\"match\":\"exact\",\"type\":\"choice\",\"prompt\":\"Di kata رَجُلُ, bentuk apa yang dipakai huruf ج?\",\"options\":[\"bentuk awal\",\"bentuk tengah\",\"bentuk akhir\"],\"answer\":\"bentuk awal\"}]},\"lessons\":[{\"id\":\"huruf1-01-kamu-sudah-tahu\",\"slug\":\"01-kamu-sudah-tahu\",\"rung\":\"huruf-1\",\"order\":1,\"status\":\"draft\",\"minutes\":6,\"title\":{\"target\":\"مِنَ اليَمِينِ إِلَى اليَ
